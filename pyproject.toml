[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure_scanner"
dynamic = ["version"]
description = "Handwritten clinical note extraction with Azure Document Intelligence and Azure OpenAI (clinician review required)"
readme = "README.md"
requires-python = ">=3.10"
# Authoritative runtime dependency list. Lower bounds are the versions verified by the
# minimum-version test run (see README "Verifying minimum versions"); upper bounds stop
# untested major releases from being picked up silently.
dependencies = [
    "azure-ai-documentintelligence>=1.0.0,<2",
    "azure-core>=1.30.0,<2",
    "azure-identity>=1.15.0,<2",
    "openai>=1.106.0,<4",
    "opencv-python-headless>=4.9.0.80,<6",
    "pypdfium2>=4.30.0,<6",
    "numpy>=1.26.0,<3",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyright>=1.1.380",
]

[project.scripts]
azure-scanner = "azure_scanner.main:cli"

[tool.setuptools.dynamic]
version = { attr = "azure_scanner.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["live: requires real Azure credentials; never run by default"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "B017"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/azure_scanner"]

# Pyright / Pylance: same scope as CI so the editor and the command line agree.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
