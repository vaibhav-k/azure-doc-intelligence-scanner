name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            constraints: "lowest"   # minimum supported dependency versions
          - python: "3.13"
            constraints: "locked"   # requirements-lock.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Install (lowest direct dependencies)
        if: matrix.constraints == 'lowest'
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - name: Install (locked)
        if: matrix.constraints == 'locked'
        run: uv pip install --system -r requirements-lock.txt && uv pip install --system --no-deps -e .
      - run: ruff check src tests
      - run: mypy
      - run: pyright
      - run: pytest --cov=azure_scanner --cov-report=term-missing --cov-fail-under=85
      - name: Dependency audit
        run: uv pip install --system pip-audit && pip-audit -r requirements-lock.txt
